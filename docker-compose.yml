services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: cloudpivot-postgres
    environment:
      POSTGRES_DB: cloudpivot
      POSTGRES_USER: cloudpivot
      POSTGRES_PASSWORD: cloudpivot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudpivot"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cloudpivot-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # CloudPivot Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudpivot-backend
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_SECRET_KEY: ${APP_SECRET_KEY:-change-me-in-production}
      DATABASE_URL: postgresql+asyncpg://cloudpivot:cloudpivot@postgres:5432/cloudpivot
      REDIS_URL: redis://redis:6379/0
      DOCKER_HOST: unix:///var/run/docker.sock
      LOG_LEVEL: INFO
    volumes:
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
